version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    restart: always
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace_dev_password
      POSTGRES_DB: syncspace_db
    ports:
      - "5432:5432"
    volumes:
      - syncspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sync-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    container_name: syncspace-relay
    restart: always
    ports:
      - "1234:1234"
    environment:
      DATABASE_URL: "postgresql://syncspace:syncspace_dev_password@postgres:5432/syncspace_db?schema=public"
      SYNC_SERVER_PORT: "1234"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  syncspace_pgdata:
